	<script>
		const RECONNECT_DELAY = 5000;

		let ws;

		const CUBE_CACHE_MAX = 12;
		const cubeCache = new Map();

		function cacheFor(mac) {
			let e = cubeCache.get(mac);
			if (!e) {
				if (cubeCache.size >= CUBE_CACHE_MAX) cubeCache.delete(cubeCache.keys().next().value);
				e = {};
				cubeCache.set(mac, e);
			}
			return e;
		}

		function setGridLoading(on) {
			const grid = document.getElementById('grid');
			const cur = grid.querySelector('.grid-loading');
			if (on) {
				if (cur) return;
				grid.innerHTML = '';
				const el = document.createElement('div');
				el.className = 'grid-loading';
				el.textContent = 'Loading…';
				grid.appendChild(el);
			} else if (cur) {
				cur.remove();
			}
		}

		function cubeBase() {
			return (!activeCube || activeCube.self) ? '' : 'http://' + activeCube.ip;
		}

		function wsHost() {
			return (activeCube && !activeCube.self) ? activeCube.ip : location.host;
		}

		const APC_COLORS = [
			{ v: -1, label: 'Default',    hex: '#555555' },
			{ v: 1,  label: 'Red',        hex: '#ff0000' },
			{ v: 2,  label: 'Green',      hex: '#00d000' },
			{ v: 3,  label: 'Blue',       hex: '#2050ff' },
			{ v: 4,  label: 'Yellow',     hex: '#ffe000' },
			{ v: 5,  label: 'Cyan',       hex: '#00e0e0' },
			{ v: 6,  label: 'Magenta',    hex: '#ff00ff' },
			{ v: 7,  label: 'White',      hex: '#ffffff' },
			{ v: 8,  label: 'Orange',     hex: '#ff8000' },
			{ v: 9,  label: 'Purple',     hex: '#9040ff' },
			{ v: 10, label: 'Salmon',     hex: '#fa8072' },
			{ v: 11, label: 'Pink',       hex: '#ff69b4' },
			{ v: 12, label: 'Lime',       hex: '#b0ff30' },
			{ v: 13, label: 'Cornflower', hex: '#6495ed' },
			{ v: 14, label: 'Mocha',      hex: '#a0785a' },
			{ v: 15, label: 'Ice Blue',   hex: '#a5f2f3' }
		];

		const TRASH_SVG = '<svg viewBox="0 0 448 512"><path d="M135.2 17.7L128 32H32C14.3 32 0 46.3 0 64s14.3 32 32 32h384c17.7 0 32-14.3 32-32s-14.3-32-32-32h-96l-7.2-14.3C307.4 6.8 296.3 0 284.2 0H163.8c-12.1 0-23.2 6.8-28.6 17.7zM416 128H32l21.2 339c1.6 25.3 22.6 45 47.9 45h245.8c25.3 0 46.3-19.7 47.9-45L416 128z"/></svg>';
		const RESET_SVG = '<svg viewBox="0 0 512 512"><path d="M463.5 224H472c13.3 0 24-10.7 24-24V72c0-9.7-5.8-18.5-14.8-22.2s-19.3-1.7-26.2 5.2L413.4 96.6c-87.6-86.5-228.7-86.2-315.8 1c-87.5 87.5-87.5 229.3 0 316.8s229.3 87.5 316.8 0c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0c-62.5 62.5-163.8 62.5-226.3 0s-62.5-163.8 0-226.3c62.2-62.2 162.7-62.5 225.3-1L327 183c-6.9 6.9-8.9 17.2-5.2 26.2s12.5 14.8 22.2 14.8H463.5z"/></svg>';

		function getPlaylistKind(name) {
			const opt = playlistOptions.find(o => o.value === name);
			return opt ? opt.kind : 'builtin';
		}

		function setPopupMsg(text, ok) {
			const el = document.getElementById('popup-msg');
			el.textContent = text || '';
			el.classList.toggle('ok', !!ok);
		}

		function closeOverlay(id) {
			document.getElementById(id).classList.remove('active');
		}

		function setPopupInset(overlayId) {
			const item = document.querySelector('.grid-item');
			const overlay = document.getElementById(overlayId);
			if (overlay) overlay.style.setProperty('--grid-item-h', (item ? item.offsetHeight : 90) + 'px');
		}

		function popupAutoClose() {
			if (popupCloseTimer) clearTimeout(popupCloseTimer);
			popupCloseTimer = setTimeout(() => closeOverlay('tile-popup'), 1000);
		}

		let toastTimer = null;
		function showToast(msg) {
			const t = document.getElementById('toast');
			t.textContent = msg;
			t.classList.add('show');
			if (toastTimer) clearTimeout(toastTimer);
			toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
		}

		let autoScrollTimer = null, autoScrollDy = 0;
		function autoScroll(clientY) {
			const container = document.getElementById('grid').parentElement;
			const r = container.getBoundingClientRect();
			autoScrollDy = 0;
			if (clientY < r.top + 48) autoScrollDy = -10;
			else if (clientY > r.bottom - 48) autoScrollDy = 10;
			if (autoScrollDy === 0) { stopAutoScroll(); return; }
			if (!autoScrollTimer) {
				autoScrollTimer = setInterval(() => { container.scrollTop += autoScrollDy; }, 30);
			}
		}
		function stopAutoScroll() {
			if (autoScrollTimer) { clearInterval(autoScrollTimer); autoScrollTimer = null; }
			autoScrollDy = 0;
		}

		function flashTile(wrapper) {
			wrapper.classList.add('drop-flash');
			setTimeout(() => wrapper.classList.remove('drop-flash'), 400);
		}

		function swallowNextClicks(windowMs) {
			const swallow = e => { e.stopPropagation(); e.preventDefault(); };
			document.addEventListener('click', swallow, true);
			setTimeout(() => document.removeEventListener('click', swallow, true), windowMs || 150);
		}

		function postPlaylistEdit(op, playlist, item, onOk, onFail, extra) {
			const showFail = (m) => {
				if (typeof onFail === 'function') {
					onFail(m);
				} else {
					const el = document.getElementById(onFail || 'popup-msg');
					if (el) { el.textContent = m; el.classList.remove('ok'); }
				}
				loadPlaylists();
			};
			if (lastSdcardState === false) { showFail('No SD card inserted'); return; }
			fetch(cubeBase() + '/api/playlist/playlist-edit', {
				method: 'POST',
				headers: { 'Content-Type': 'text/plain' },
				body: JSON.stringify(Object.assign({ op, playlist, item }, extra || {}))
			})
			.then(res => res.json())
			.then(d => {
				if (d.ok) {
					if (typeof d.pl_rev === 'number') {
						plRev = d.pl_rev;
						if (activeCube) cacheFor(activeCube.mac).plRev = plRev;
					}
					onOk(d);
				} else {
					showFail(d.error || 'Failed');
				}
			})
			.catch(() => showFail('Device not responding'));
		}


		function setColorTrigger(v) {
			const opt = APC_COLORS.find(o => o.v === v);
			document.getElementById('apc-color-swatch').style.background = opt ? opt.hex : '#555555';
			document.getElementById('apc-color-name').textContent = opt ? opt.label : ('Custom (' + v + ')');
		}

		function updateScrollInd(list, ind) {
			const sh = list.scrollHeight, ch = list.clientHeight;
			if (list.style.display === 'none' || sh <= ch + 1) {
				ind.style.opacity = '0';
				return;
			}
			const h = Math.max(20, ch * ch / sh);
			ind.style.height = h + 'px';
			ind.style.top = ((list.scrollTop / (sh - ch)) * (ch - h)) + 'px';
			ind.style.opacity = '1';
		}

		function refreshPopupScrollInds() {
			updateScrollInd(document.getElementById('tile-popup-targets'), document.getElementById('targets-ind'));
			updateScrollInd(document.getElementById('apc-color-list'), document.getElementById('apc-color-ind'));
		}

		function toggleColorList(show) {
			const list = document.getElementById('apc-color-list');
			if (show) {
				const card = list.closest('.modal-card');
				if (card) list.style.maxHeight = Math.floor(card.getBoundingClientRect().height / 2) + 'px';
				list.style.display = 'block';
			} else {
				list.style.display = 'none';
			}
			refreshPopupScrollInds();
		}

		function buildColorList() {
			const list = document.getElementById('apc-color-list');
			list.innerHTML = '';
			APC_COLORS.forEach(opt => {
				const btn = document.createElement('button');
				btn.className = 'apc-color-opt';
				const sw = document.createElement('span');
				sw.className = 'apc-swatch';
				sw.style.background = opt.hex;
				const name = document.createElement('span');
				name.textContent = opt.label;
				btn.appendChild(sw);
				btn.appendChild(name);
				btn.onclick = () => {
					const sel = document.getElementById('playlist-selection');
					const cur = sel ? sel.value : '';
					postPlaylistEdit('set_color', cur, popupItemName, () => {
						setColorTrigger(opt.v);
						toggleColorList(false);
						setPopupMsg('Colour updated', true);
					}, null, { color: opt.v });
				};
				list.appendChild(btn);
			});
		}

		function openTilePopup(itemName, imgUrl) {
			if (popupCloseTimer) { clearTimeout(popupCloseTimer); popupCloseTimer = null; }
			setPopupInset('tile-popup');
			popupItemName = itemName;
			document.getElementById('tile-popup-title').textContent = 'Add "' + itemName + '" to playlist';
			const imgEl = document.getElementById('tile-popup-img');
			if (imgUrl) {
				imgEl.src = cubeBase() + imgUrl;
				imgEl.style.display = 'block';
			} else {
				imgEl.removeAttribute('src');
				imgEl.style.display = 'none';
			}
			setPopupMsg('');
			document.getElementById('new-pl-name').value = '';

			const sel = document.getElementById('playlist-selection');
			const cur = sel ? sel.value : '';

			const targets = document.getElementById('tile-popup-targets');
			targets.innerHTML = '';
			const badges = { user: 'custom', shadow: 'customised', builtin: 'built-in' };
			playlistOptions.forEach(opt => {
				if (opt.value === 'All') return;
				const btn = document.createElement('button');
				btn.className = 'pl-target-btn';
				const nameSpan = document.createElement('span');
				nameSpan.textContent = opt.label;
				const badge = document.createElement('span');
				badge.className = 'pl-kind-badge';
				badge.textContent = badges[opt.kind] || '';
				btn.appendChild(nameSpan);
				btn.appendChild(badge);
				btn.onclick = () => {
					postPlaylistEdit('add', opt.value, popupItemName, () => {
						setPopupMsg('Added to ' + opt.label, true);
						popupAutoClose();
						loadPlaylists();
						if (sel && sel.value === opt.value) getSelectedPlaylistImage();
					});
				};
				targets.appendChild(btn);
			});

			const colorRow = document.getElementById('pl-color-row');
			toggleColorList(false);
			if (cur && cur !== 'All') {
				colorRow.style.display = 'flex';
				setColorTrigger(-1);
				postPlaylistEdit('get_color', cur, itemName, (d) => {
					setColorTrigger(typeof d.color === 'number' ? d.color : -1);
				});
			} else {
				colorRow.style.display = 'none';
			}

			const removeBtn = document.getElementById('tile-popup-remove');
			const curKind = getPlaylistKind(cur);
			if (cur && cur !== 'All' && (curKind === 'user' || curKind === 'shadow')) {
				removeBtn.style.display = '';
				removeBtn.textContent = 'Remove from ' + cur;
				removeBtn.onclick = () => {
					postPlaylistEdit('remove', cur, popupItemName, () => {
						closeOverlay('tile-popup');
						loadPlaylists();
						getSelectedPlaylistImage();
					});
				};
			} else {
				removeBtn.style.display = 'none';
			}

			document.getElementById('tile-popup').classList.add('active');
			refreshPopupScrollInds();
		}

		function updateDeleteBtn() {
			const btn = document.getElementById('playlist-delete-btn');
			if (!btn) return;
			const sel = document.getElementById('playlist-selection');
			const kind = (plEdit && sel && sel.value) ? getPlaylistKind(sel.value) : 'builtin';
			if (kind === 'user') {
				btn.innerHTML = TRASH_SVG;
				btn.title = 'Delete playlist';
				btn.style.display = 'block';
			} else if (kind === 'shadow') {
				btn.innerHTML = RESET_SVG;
				btn.title = 'Reset to default';
				btn.style.display = 'block';
			} else {
				btn.style.display = 'none';
			}
		}

		function openConfirmPopup() {
			const sel = document.getElementById('playlist-selection');
			const name = sel ? sel.value : '';
			if (!name || name === 'All') return;
			setPopupInset('confirm-popup');
			const kind = getPlaylistKind(name);
			const confirmText = document.getElementById('confirm-text');
			const yesBtn = document.getElementById('confirm-yes');
			if (kind === 'shadow') {
				confirmText.textContent = 'Reset "' + name + '" to its default contents?';
				yesBtn.textContent = 'Reset';
			} else {
				confirmText.textContent = 'Are you sure you want to delete "' + name + '"?';
				yesBtn.textContent = 'Delete';
			}
			document.getElementById('confirm-msg').textContent = '';
			yesBtn.onclick = () => {
				postPlaylistEdit('delete', name, null, () => {
					closeOverlay('confirm-popup');
					loadPlaylists();
					getSelectedPlaylistImage();
				}, 'confirm-msg');
			};
			document.getElementById('confirm-popup').classList.add('active');
		}

		function updateTemperature(value) {
		  const icon = document.querySelector('.temp-icon');
		  if (value === null) {
		    document.getElementById('temp-value').textContent = '--';
		    icon.style.fill = 'orange';
		    return;
		  }
		  document.getElementById('temp-value').textContent = value;
		  if (value < 65) icon.style.fill = 'deepskyblue';
		  else if (value >= 75) icon.style.fill = 'red';
		  else icon.style.fill = 'orange';
		}

		function updateWifiIcon() {
		  const icon = document.getElementById('wifiIcon');
		  const chan = document.getElementById('wifiChan');
		  if (!wifi_col) {
		    icon.style.display = 'none';
		    chan.style.display = 'none';
		    return;
		  }

		function setupSlider(sliderId, valueId, resetbtnId, min, max, def, opts) {
			const slider = document.getElementById(sliderId);
			const thumbValue = document.getElementById(valueId);
			if (!slider || !thumbValue) return;

			opts = opts || {};
			if (opts.track !== false && !allSliderIds.includes(sliderId)) allSliderIds.push(sliderId);

			slider.min = min;
			slider.max = max;
			slider.value = (opts.initial !== undefined) ? opts.initial : def;

			const wrap = slider.parentElement;

			slider.isActive = false;
			slider.addEventListener("mousedown", () => slider.isActive = true);
			slider.addEventListener("touchstart", () => slider.isActive = true);
			slider.addEventListener("mouseup", () => slider.isActive = false);
			slider.addEventListener("touchend", () => slider.isActive = false);

			function update() {
				const minVal = +slider.min;
				const maxVal = +slider.max;
				const val = +slider.value;
				const percent = (val - minVal) / (maxVal - minVal);

				wrap.style.setProperty('--percent', (percent * 100) + '%');
				thumbValue.textContent = opts.fmt ? opts.fmt(val) : val;

				const sliderWidth = slider.offsetWidth;
				thumbValue.style.left = percent * sliderWidth + 'px';
			}

			update();
			slider.addEventListener('input', () => {
				update();
				if (ws && ws.readyState === WebSocket.OPEN) {
					resetKeepAlive();
					ws.send(JSON.stringify({ [sliderId]: parseFloat(slider.value) }));
				}
			});
			window.addEventListener('resize', update);

			const resetbtn = document.getElementById(resetbtnId);
			if (!resetbtn) return;

			resetbtn.addEventListener("click", () => {
				slider.value = def;
				slider.dispatchEvent(new Event("input"));
			});

			resetbtn.classList.add('reset-btn-glow-base');
			resetbtn.addEventListener("click", () => {
				resetbtn.classList.add('clicked');
				setTimeout(() => {
					resetbtn.classList.remove('clicked');
				}, FLASH_PERIOD_MS);
			});
		}

		function sdWarnReport(key, allMissing) {
			if (sdWarnRes[key] !== null) return;

		const loadedImgUrls = new Set();

		function makeThumbChecker(key) {
			const c = { miss: 0, done: false, timer: null };
			const evalChk = () => {
				if (c.done || c.miss === 0) return;
				c.done = true;
				sdWarnReport(key, true);
			};
			return img => {
				img.addEventListener('load', () => {
					loadedImgUrls.add(img.src);
					img.style.opacity = '';
					if (c.done) return;
					c.done = true;
					if (c.timer) clearTimeout(c.timer);
					sdWarnReport(key, false);
				});
				img.addEventListener('error', () => {
					img.style.opacity = '0';
					if (c.done) return;
					c.miss++;
					if (c.timer) clearTimeout(c.timer);
					c.timer = setTimeout(evalChk, 1000);
				});
			};
		}
		const trackGridThumb = makeThumbChecker('grid');
		const trackFxThumb = makeThumbChecker('fx');

		function gridSigOf(list) {
			const sel = document.getElementById('playlist-selection');
			return plEdit + '|' + deviceMode + '|' + (sel ? sel.value : '') + '|' + JSON.stringify(list);
		}

		function renderGrid(list) {
					gridSig = gridSigOf(list);
					const grid = document.getElementById('grid');
					let selectedName = '';
					grid.innerHTML = '';
					const gridSel = document.getElementById('playlist-selection');
					const dragEligible = plEdit && gridSel && gridSel.value && gridSel.value !== 'All';
					if (!list.length) sdWarnReport('grid', false);
					list.forEach((url, i) => {
						const wrapper = document.createElement('div');
						wrapper.className = 'grid-item';

						const tile = document.createElement('div');
						tile.className = 'grid-tile';
						tile.style.setProperty('--tile-color', TILE_COLORS[i % TILE_COLORS.length]);

						const img = document.createElement('img');
						img.src = cubeBase() + url;
						if (!loadedImgUrls.has(img.src)) img.style.opacity = '0';
						img.loading = 'lazy';
						img.draggable = false;
						trackGridThumb(img);
						tile.appendChild(img);
						wrapper.appendChild(tile);

						const label = document.createElement('div');
						label.className = 'grid-label';
						label.textContent = getDisplayNameFromUrl(url);
						wrapper.appendChild(label);

						if (url === selectedUrl) {
							img.classList.add('selected');
							selectedImg = img;
							wrapper.classList.add('selected');
							selectedName = getDisplayNameFromUrl(url);
						}

						img.onclick = () => {
							if (swallowTileClick) { swallowTileClick = false; return; }
							if (selectedImg) {
								selectedImg.classList.remove('selected');
								const prev = selectedImg.closest('.grid-item');
								if (prev) prev.classList.remove('selected');
							}
							selectedImg = img;
							img.classList.add('selected');
							wrapper.classList.add('selected');
							selectedName = getDisplayNameFromUrl(url);
							const nameEl = document.getElementById('selected-name');
							if (nameEl) nameEl.textContent = selectedName || '';
							fetch(cubeBase() + '/api/playlist/image-clicked', {
								method: 'POST',
								headers: { 'Content-Type': 'text/plain' },
								body: JSON.stringify({ url })
							}).catch(err => console.error('Click handler error:', err));
						};

						if (dragEligible) wrapper.style.touchAction = 'pan-y';

						let lpTimer = null, lpX = 0, lpY = 0, lpFired = false;
						let dragging = false, dragFrom = -1, swallowTileClick = false;
						let dragTx = 0, dragTy = 0, grabX = 0, grabY = 0, dragPointerId = null;
						const cancelLongPress = () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } };

						const onDocPointerMove = (e) => { if (e.pointerId === dragPointerId) onDragMove(e); };
						const onDocPointerUp = (e) => { if (e.pointerId === dragPointerId) endDrag(false); };
						const onDocPointerCancel = (e) => { if (e.pointerId === dragPointerId) endDrag(true); };
						const onDocTouchMove = (e) => { e.preventDefault(); };
						const onDocTouchEnd = (e) => {
							e.preventDefault();
							document.removeEventListener('touchend', onDocTouchEnd);
						};

						const startDrag = (e) => {
							dragging = true;
							dragFrom = Array.prototype.indexOf.call(grid.children, wrapper);
							cancelLongPress();
							const r = wrapper.getBoundingClientRect();
							grabX = e.clientX - r.left;
							grabY = e.clientY - r.top;
							dragTx = 0;
							dragTy = 0;
							wrapper.classList.add('dragging');
							wrapper.style.transform = 'scale(1.06)';
							dragPointerId = e.pointerId;
							document.addEventListener('pointermove', onDocPointerMove);
							document.addEventListener('pointerup', onDocPointerUp);
							document.addEventListener('pointercancel', onDocPointerCancel);
							document.addEventListener('touchmove', onDocTouchMove, { passive: false });
							document.addEventListener('touchend', onDocTouchEnd, { passive: false });
						};

						const onDragMove = (e) => {
							let target = null;
							const kids = grid.children;
							for (let k = 0; k < kids.length; k++) {
								const el = kids[k];
								if (el === wrapper) continue;
								const kr = el.getBoundingClientRect();
								if (e.clientX >= kr.left && e.clientX <= kr.right &&
									e.clientY >= kr.top && e.clientY <= kr.bottom) {
									target = el;
									break;
								}
							}
							if (target) {
								const r = target.getBoundingClientRect();
								const after = (e.clientY > r.top + r.height / 2) ||
											  (e.clientY >= r.top && e.clientY <= r.bottom && e.clientX > r.left + r.width / 2);
								const ref = after ? target.nextSibling : target;
								if (ref !== wrapper && ref !== wrapper.nextSibling) {
									grid.insertBefore(wrapper, ref);
								}
							}
							const wr = wrapper.getBoundingClientRect();
							dragTx = (e.clientX - grabX) - (wr.left - dragTx);
							dragTy = (e.clientY - grabY) - (wr.top - dragTy);
							wrapper.style.transform = 'translate(' + dragTx + 'px,' + dragTy + 'px) scale(1.06)';
							autoScroll(e.clientY);
						};

						const endDrag = (aborted) => {
							stopAutoScroll();
							document.removeEventListener('pointermove', onDocPointerMove);
							document.removeEventListener('pointerup', onDocPointerUp);
							document.removeEventListener('pointercancel', onDocPointerCancel);
							document.removeEventListener('touchmove', onDocTouchMove);
							setTimeout(() => document.removeEventListener('touchend', onDocTouchEnd), 250);
							dragPointerId = null;
							wrapper.classList.remove('dragging');
							wrapper.style.transform = '';
							wrapper.style.pointerEvents = '';
							const to = Array.prototype.indexOf.call(grid.children, wrapper);
							dragging = false;
							if (aborted) {
								if (to !== dragFrom) getSelectedPlaylistImage();
								return;
							}
							if (to === dragFrom) return;
							swallowTileClick = true;
							setTimeout(() => { swallowTileClick = false; }, 400);
							const sel = document.getElementById('playlist-selection');
							postPlaylistEdit('move', sel ? sel.value : '', getDisplayNameFromUrl(url), () => {
								flashTile(wrapper);
							}, (m) => {
								showToast(m);
								getSelectedPlaylistImage();
							}, { from: dragFrom, to });
						};

						wrapper.addEventListener('pointerdown', e => {
							if (!plEdit) return;
							lpX = e.clientX; lpY = e.clientY;
							cancelLongPress();
							lpTimer = setTimeout(() => {
								lpTimer = null;
								lpFired = true;
								openTilePopup(getDisplayNameFromUrl(url), url);
							}, 550);
						});
						wrapper.addEventListener('pointermove', e => {
							if (dragging) return;
							if (!lpTimer) return;
							const dx = Math.abs(e.clientX - lpX), dy = Math.abs(e.clientY - lpY);
							if (dx <= 10 && dy <= 10) return;
							if (dragEligible && (e.pointerType === 'mouse' || dx > dy)) {
								startDrag(e);
							} else {
								cancelLongPress();
							}
						});
						wrapper.addEventListener('pointerup', () => {
							if (dragging) return;
							if (lpFired) {
								lpFired = false;
								swallowNextClicks(150);
							}
							cancelLongPress();
						});
						wrapper.addEventListener('pointercancel', () => {
							lpFired = false;
							if (dragging) return;
							cancelLongPress();
						});
						wrapper.addEventListener('pointerleave', () => {
							if (dragging) return;
							cancelLongPress();
						});
						wrapper.addEventListener('contextmenu', e => {
							if (!plEdit) return;
							e.preventDefault();
							if (dragging) return;
							cancelLongPress();
							if (!document.getElementById('tile-popup').classList.contains('active')) {
								openTilePopup(getDisplayNameFromUrl(url), url);
							}
						});

						grid.appendChild(wrapper);
					});

					const selected = grid.querySelector('.grid-item.selected');
					if (selected) selected.scrollIntoView({ behavior: jumpToCue ? 'auto' : 'smooth', block: 'center' });
					updateSelectedName(selectedName);
					if (gridRetryTimer) { clearTimeout(gridRetryTimer); gridRetryTimer = null; }
		}

		function loadGrid() {
			const gen = cubeGen;
			fetch(cubeBase() + '/api/playlist/image-list')
				.then(res => res.json())
				.then(list => {
					if (gen !== cubeGen) return;
					if (activeCube) {
						const e = cacheFor(activeCube.mac);
						e.grid = list;
						e.selUrl = selectedUrl;
					}
					if (gridSigOf(list) === gridSig) {
						if (selectedUrl) highlightGridItemByUrl(selectedUrl);
						if (gridRetryTimer) { clearTimeout(gridRetryTimer); gridRetryTimer = null; }
						return;
					}
					renderGrid(list);
				})
				.catch(err => {
					if (gen !== cubeGen) return;
					console.error('Error loading images:', err);
					if (gridRetryTimer) clearTimeout(gridRetryTimer);
					gridRetryTimer = setTimeout(getSelectedPlaylistImage, 2000);
				});
		}

		function highlightGridItemByUrl(url) {
			const grid = document.getElementById('grid');
			const container = grid.parentElement;
			const gridItems = grid.querySelectorAll(".grid-item");

			gridItems.forEach(item => {
				const img = item.querySelector("img");
				if (!img) return;

				const imgSrc = new URL(img.src, cubeBase() || window.location.origin).href;
				const targetUrl = new URL(url, cubeBase() || window.location.origin).href;

				if (imgSrc === targetUrl) {
					img.classList.add('selected');
					item.classList.add('selected');
					selectedImg = img;

					const itemTop = item.offsetTop;
					const itemBottom = itemTop + item.offsetHeight;
					const containerTop = container.scrollTop;
					const containerBottom = containerTop + container.clientHeight;

					if (itemTop < containerTop || itemBottom > containerBottom) {
						item.scrollIntoView({ behavior: jumpToCue ? 'auto' : 'smooth', block: 'center' });
					}

					updateSelectedName(url);

				} else {
					img.classList.remove('selected');
					item.classList.remove('selected');
				}
			});
		}

		const FX_TY_BPM_MULT = 11;

		function fxBpmMultLabel(v) {
			if (v === 0) return '1';
			return v < 0 ? String(1 << -v) : '1/' + (1 << v);
		}

		let fxAdjPopover = null;

		function fxAdjOutsideDown(e) {
			if (fxAdjPopover && !fxAdjPopover.contains(e.target)) closeFxAdjPopover();
		}

		let fxAdjReq = 0;

		function closeFxAdjPopover() {
			fxAdjReq++;
			if (!fxAdjPopover) return;
			fxAdjPopover.remove();
			fxAdjPopover = null;
			document.removeEventListener('pointerdown', fxAdjOutsideDown, true);
		}

		function openFxAdjPopover(id, tile) {
			if (id !== fxCurrentSel()) return;
			const eff = fxList && fxList.find(x => x.id === id);
			if (!eff) return;
			closeFxAdjPopover();
			if (!Array.isArray(eff.adjs) || !eff.adjs.length) {
				buildFxAdjPopover(eff, {}, tile);
				return;
			}
			const req = ++fxAdjReq;
			fetch(cubeBase() + '/api/effects/adj-vals?id=' + encodeURIComponent(id))
				.then(res => res.json())
				.then(vals => {
					if (req !== fxAdjReq) return;
					if (id !== fxCurrentSel()) return;
					buildFxAdjPopover(eff, vals, tile);
				})
				.catch(err => console.error('Failed to load effect param values:', err));
		}

		function buildFxAdjPopover(eff, vals, tile) {
			closeFxAdjPopover();

			const pop = document.createElement('div');
			pop.id = 'fx-adj-popover';
			pop.dataset.fxId = eff.id;

			const title = document.createElement('div');
			title.className = 'fx-adj-title';
			title.textContent = eff.name;
			pop.appendChild(title);

			const adjs = eff.adjs || [];
			if (!adjs.length) {
				const none = document.createElement('div');
				none.className = 'fx-adj-none';
				none.textContent = 'No adjustments';
				pop.appendChild(none);
			}

			const sliders = [];
			adjs.forEach(adj => {
				const fid = eff.id + '/' + adj.n;
				const row = document.createElement('div');
				row.className = 'fx-adj-row';

				const label = document.createElement('div');
				label.className = 'slider-label';
				label.textContent = adj.n;
				row.appendChild(label);

				if (adj.sw) {
					const swLabel = document.createElement('label');
					swLabel.className = 'switch';
					const cb = document.createElement('input');
					cb.type = 'checkbox';
					cb.checked = (vals[fid] || 0) > 0;
					const knob = document.createElement('span');
					knob.className = 'slider';
					swLabel.appendChild(cb);
					swLabel.appendChild(knob);
					row.appendChild(swLabel);
					cb.addEventListener('change', () => {
						if (ws && ws.readyState === WebSocket.OPEN) {
							ws.send(JSON.stringify({ [fid]: cb.checked ? 1 : 0 }));
						}
					});
				} else {
					const wrap = document.createElement('div');
					wrap.className = 'slider-wrap';
					const input = document.createElement('input');
					input.type = 'range';
					input.id = fid;
					input.step = adj.step > 0 ? adj.step : 1;
					const thumb = document.createElement('span');
					thumb.className = 'thumb-value';
					thumb.id = fid + '-val';
					wrap.appendChild(input);
					wrap.appendChild(thumb);
					row.appendChild(wrap);

					const reset = document.createElement('button');
					reset.className = 'reset-btn';
					reset.id = fid + '-rst';
					const img = document.createElement('img');
					img.src = '/images/restart.png';
					img.alt = 'RST';
					reset.appendChild(img);
					row.appendChild(reset);

					sliders.push(adj);
				}

				pop.appendChild(row);
			});

			document.body.appendChild(pop);

			const r = tile.getBoundingClientRect();
			const w = pop.offsetWidth, h = pop.offsetHeight;
			let top = r.bottom + 6;
			if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
			const left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8);
			pop.style.top = top + 'px';
			pop.style.left = left + 'px';

			sliders.forEach(adj => {
				const fid = eff.id + '/' + adj.n;
				setupSlider(fid, fid + '-val', fid + '-rst', adj.min, adj.max, adj.def, {
					track: false,
					initial: (vals[fid] !== undefined) ? vals[fid] : adj.def,
					fmt: adj.ty === FX_TY_BPM_MULT ? fxBpmMultLabel : null
				});
			});

			fxAdjPopover = pop;
			document.addEventListener('pointerdown', fxAdjOutsideDown, true);
			const gridWrap = document.querySelector('.fx-grid-wrap');
			if (gridWrap) gridWrap.addEventListener('scroll', closeFxAdjPopover, { once: true });
		}

		function applyFxSelection() {
			const sel = fxCurrentSel();
			document.querySelectorAll('#fx-grid .grid-item').forEach(item => {
				item.classList.toggle('selected', item.dataset.fxId === sel);
			});
			if (fxAdjPopover && fxAdjPopover.dataset.fxId !== sel) closeFxAdjPopover();
		}

		function fxTileClicked(id) {
			if (fxTab === 'col') fxSelCol = id; else fxSelImg = id;
			applyFxSelection();
			if (ws && ws.readyState === WebSocket.OPEN) {
				ws.send(JSON.stringify({ fx_sel: { cat: fxTab, id: id } }));
			}
		}

		function buildFxGrid() {
			const grid = document.getElementById('fx-grid');
			grid.innerHTML = '';
			if (!fxList) return;

			const makeTile = (id, labelText, fill) => {
				const wrapper = document.createElement('div');
				wrapper.className = 'grid-item';
				wrapper.dataset.fxId = id;

				const tile = document.createElement('div');
				tile.className = 'grid-tile';
				fill(tile);
				wrapper.appendChild(tile);

				const label = document.createElement('div');
				label.className = 'grid-label';
				label.textContent = labelText;
				wrapper.appendChild(label);

				let lpFired = false;
				wrapper.onclick = () => {
					if (lpFired) { lpFired = false; return; }
					fxTileClicked(id);
				};

				if (id) {
					let lpTimer = null;
					const cancelLp = () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } };
					wrapper.addEventListener('pointerdown', () => {
						cancelLp();
						lpFired = false;
						lpTimer = setTimeout(() => {
							lpTimer = null;
							lpFired = true;
							openFxAdjPopover(id, tile);
						}, 550);
					});
					wrapper.addEventListener('pointerup', cancelLp);
					wrapper.addEventListener('pointercancel', cancelLp);
					wrapper.addEventListener('pointerleave', cancelLp);
				}

				grid.appendChild(wrapper);
				return wrapper;
			};

			makeTile('', 'No Effect', tile => {
				const glyph = document.createElement('div');
				glyph.className = 'fx-none-glyph';
				glyph.textContent = '∅';
				tile.appendChild(glyph);
			});

			fxList.filter(e => e.cat === fxTab).forEach(e => {
				const w = makeTile(e.id, e.name, tile => {
					const url = cubeBase() + '/effects/previews/' + encodeURIComponent(e.name) + '.png?v=' + fxCacheVer;
					const img = document.createElement('img');
					img.src = url;
					if (!loadedImgUrls.has(img.src)) img.style.opacity = '0';
					img.loading = 'lazy';
					img.draggable = false;
					trackFxThumb(img);
					tile.appendChild(img);
				});
				if (Array.isArray(e.adjs) && e.adjs.length) w.classList.add('fx-has-adjs');
			});

			applyFxSelection();
		}

		function scrollFxSelectedIntoView() {
			const wrap = document.querySelector('.fx-grid-wrap');
			const item = document.querySelector('#fx-grid .grid-item.selected');
			if (!wrap || !item) return;
			const wrapRect = wrap.getBoundingClientRect();
			const itemRect = item.getBoundingClientRect();
			if (itemRect.top < wrapRect.top || itemRect.bottom > wrapRect.bottom) {
				item.scrollIntoView({ behavior: 'smooth', block: 'center' });
			}
		}

		function setFxTab(tab) {
			closeFxAdjPopover();
			fxTab = tab;
			document.getElementById('fx-tab-img').classList.toggle('active', tab === 'img');
			document.getElementById('fx-tab-col').classList.toggle('active', tab === 'col');
			buildFxGrid();
			scrollFxSelectedIntoView();
		}

		function loadEffectsList() {
			const gen = cubeGen;
			fetch(cubeBase() + '/api/effects/effect-list')
				.then(res => res.json())
				.then(data => {
					if (gen !== cubeGen) return;
					if (fxRetryTimer) { clearTimeout(fxRetryTimer); fxRetryTimer = null; }
					fxList = data.effects || [];
					fxList.sort((a, b) => {
						const an = a.name.toLowerCase(), bn = b.name.toLowerCase();
						return an < bn ? -1 : an > bn ? 1 : 0;
					});
					fxCacheVer = data.cache_version || 1;
					if (typeof data.sel_img === 'string') fxSelImg = data.sel_img;
					if (typeof data.sel_col === 'string') fxSelCol = data.sel_col;
					if (activeCube) {
						const e = cacheFor(activeCube.mac);
						e.fxList = fxList;
						e.fxCacheVer = fxCacheVer;
					}
					const sig = JSON.stringify(fxList) + '|' + fxCacheVer;
					if (sig === fxSig) {
						applyFxSelection();
					} else {
						fxSig = sig;
						buildFxGrid();
					}
					if (fxPopupPending) {
						fxPopupPending = false;
						showEffectsPanel();
					}
				})
				.catch(err => {
					if (gen !== cubeGen) return;
					console.error('Failed to load effects list:', err);
					if (fxRetryTimer) clearTimeout(fxRetryTimer);
					fxRetryTimer = setTimeout(loadEffectsList, 2000);
				});
		}

		function showEffectsPanel() {
			document.getElementById('effects-popup').classList.add('active');
			scrollFxSelectedIntoView();
		}

		function openEffectsPopup() {
			setPopupInset('effects-popup');
			document.getElementById('colorBtn').classList.add('active');
			if (!fxList) {
				const e = activeCube ? cubeCache.get(activeCube.mac) : null;
				if (e && e.fxList) {
					fxList = e.fxList;
					fxCacheVer = e.fxCacheVer || 1;
					fxSig = JSON.stringify(fxList) + '|' + fxCacheVer;
					buildFxGrid();
					loadEffectsList();
					showEffectsPanel();
				} else {
					fxPopupPending = true;
					loadEffectsList();
				}
			} else {
				buildFxGrid();
				showEffectsPanel();
			}
		}

		function closeEffectsPopup() {
			fxPopupPending = false;
			closeFxAdjPopover();
			closeOverlay('effects-popup');
			document.getElementById('colorBtn').classList.remove('active');
		}

		function parse_msg(msg)
		{
			if (msg.type === "init") {
			    let updatedBattery = false;

				if (typeof msg.mac === 'string' && activeCube && activeCube.mac && msg.mac !== activeCube.mac) {
					showToast('Cube changed address, rescanning');
					teardownWs();
					loadCubes(true);
					return;
				}

				if (!gotInit) {
					gotInit = true;
					jumpToCue = false;
					schedulePrefetch(4000);
					const gen = cubeGen;
					setTimeout(() => { if (gen === cubeGen && !fxList) loadEffectsList(); }, 1500);
				}

				allSliderIds.forEach(sliderId => {
					const slider = document.getElementById(sliderId);
					if (slider && slider.type === "range" && !slider.isActive && Array.isArray(msg.sliders)) {
					    const sliderObj = msg.sliders.find(obj => sliderId in obj);
					    if (sliderObj) {
					        const newValue = sliderObj[sliderId];
					        if (slider.value != newValue) {
					            slider.value = newValue;
					            slider.dispatchEvent(new Event("input"));
					        }
					    }
					}
				});

				if (Array.isArray(msg.sliders)) {
					allSliderIds.forEach(sliderId => {
						const slider = document.getElementById(sliderId);
						const row = slider ? slider.closest('.slider-row') : null;
						if (row) {
							const alive = msg.sliders.some(obj => sliderId in obj);
							row.style.display = alive ? '' : 'none';
						}
					});
				}

				if (msg.mode) {
					const modeChanged = (seenMode && seenMode !== msg.mode);
					seenMode = msg.mode;
					deviceMode = msg.mode;
					if (modeChanged) {
						closeOverlay('tile-popup');
						closeOverlay('confirm-popup');
						toggleColorList(false);
						loadPlaylists();
						getSelectedPlaylistImage();
					}
					const animSwitch = document.getElementById('animatedSwitch');
					const animRow = animSwitch ? animSwitch.closest('.switch-row') : null;
					if (animRow) animRow.style.display = (msg.mode === 'playlist') ? '' : 'none';
				}

				if (msg.playlist) {
					const select = document.getElementById('playlist-selection');
					if (select && select.options.length === 0) loadPlaylists();
					if (select && select.value !== msg.playlist) {
						select.value = msg.playlist;
						loadGrid();
					}
					updateDeleteBtn();
				}

				if (typeof msg.pl_edit === "boolean" && plEdit !== msg.pl_edit) {
					plEdit = msg.pl_edit;
					updateDeleteBtn();
					getSelectedPlaylistImage();
				}

				if (typeof msg.pl_rev === "number") {
					if (plRev !== null && msg.pl_rev !== plRev) {
						loadPlaylists();
						getSelectedPlaylistImage();
					}
					plRev = msg.pl_rev;
					if (activeCube) cacheFor(activeCube.mac).plRev = plRev;
				}

				if (msg.item_url && selectedUrl !== msg.item_url) {
					selectedUrl = msg.item_url;
					if (activeCube) cacheFor(activeCube.mac).selUrl = selectedUrl;
					highlightGridItemByUrl(selectedUrl);
				}

				if (typeof msg.ilock === "boolean") {
					if (is_ilock_en !== msg.ilock) {
						is_ilock_en = msg.ilock;
						updateILockLabel();
						updatePowerButton();
					}
				}

				if (typeof msg.eff_en === "boolean") {
					if (is_effects_en !== msg.eff_en) {
						is_effects_en = msg.eff_en;
						updateEffEnLabel();
					}
				}

				if (typeof msg.fx_img === "string" || typeof msg.fx_col === "string") {
					let fxChanged = false;
					if (typeof msg.fx_img === "string" && msg.fx_img !== fxSelImg) { fxSelImg = msg.fx_img; fxChanged = true; }
					if (typeof msg.fx_col === "string" && msg.fx_col !== fxSelCol) { fxSelCol = msg.fx_col; fxChanged = true; }
					if (fxChanged) applyFxSelection();
				}

				if (typeof msg.play === "boolean") {
					if (playing !== msg.play) {
						playing = msg.play;
						updatePlayingIcon();
					}
				}

				if (typeof msg.autoplay === "boolean") {
					if (autoplay !== msg.autoplay) {
						autoplay = msg.autoplay;
						updateAutoplayIcon();
					}
				}

				if (typeof msg.previews === "boolean") {
				    const animSwitch = document.getElementById("animatedSwitch");
				    if (animSwitch && msg.previews !== animSwitch.checked) {
						animSwitch.checked = msg.previews;
						getSelectedPlaylistImage();
					}
				}

				if (typeof msg.shuffle === "boolean") {
				    const shuffleSwitch = document.getElementById("shuffleSwitch");
				    if (shuffleSwitch) shuffleSwitch.checked = msg.shuffle;
				}

			    if ("sdcard" in msg) {
					const sdcardpanel = document.getElementById("sdcard-panel");
					const current = msg.sdcard;
			      	if (current === false) {
			        	sdcardpanel.classList.add("active");
			      	} else {
			        	sdcardpanel.classList.remove("active");
			      	}

			      	if (lastSdcardState === false && current === true) {
        				console.log("SD card inserted, refreshing...");
        				location.href = location.href;
      				}

      				lastSdcardState = current;
			    }

				if ("batt_pct" in msg) {
					const newPct = Number(msg.batt_pct);
					if (newPct !== battery_pct) {
						battery_pct = newPct;
						updatedBattery = true;
					}
				}

				if (typeof msg.charging === "boolean") {
					if (is_charging !== msg.charging) {
						is_charging = msg.charging;
						updatedBattery = true;
					}
				}

				if ("temp_degc" in msg) {
					const newtemp = Number(msg.temp_degc);
					if (newtemp !== temperature) {
						temperature = newtemp;
						updateTemperature(temperature);
					}
				}

				if (updatedBattery) {
					updateBatteryGauge();
				}

				if ("wifi_col" in msg) {
					const newcol = msg.wifi_col || null;
					const newch = ("wifi_ch" in msg) ? Number(msg.wifi_ch) : 0;
					const newchcol = msg.wifi_ch_col || null;
					if (newcol !== wifi_col || newch !== wifi_ch || newchcol !== wifi_ch_col) {
						wifi_col = newcol;
						wifi_ch = newch;
						wifi_ch_col = newchcol;
						updateWifiIcon();
					}
				}

				if (typeof msg.time === "number") {
					devClockEpoch = msg.time;
					devClockAtMs = Date.now();
					devTimeValid = Number(msg.time_valid) || 0;
					if (!timeSyncSent && devTimeValid > 0 && (devTimeValid === 1 ||
					    Math.abs(localWallEpoch() - msg.time) > 60)) {
						timeSyncSent = true;
						if (ws && ws.readyState === WebSocket.OPEN)
							ws.send(JSON.stringify({ settime: localWallEpoch() }));
					}
					updateClockRow();
				}

				if (activeCube) {
					const e = cacheFor(activeCube.mac);
					e.batt = battery_pct;
					e.chg = is_charging;
					e.ilk = is_ilock_en;
					e.tmp = temperature;
					e.wcol = wifi_col;
					e.wch = wifi_ch;
					e.wchc = wifi_ch_col;
				}
			}
		}

		function send_ws_connect_msg()
		{
			if (ws && ws.readyState === WebSocket.OPEN) {
				ws.send(JSON.stringify({ type: "connect", sliders: allSliderIds }));
			}
		}

		function localWallEpoch() {
			return Math.floor(Date.now() / 1000) - 60 * new Date().getTimezoneOffset();
		}

		function updateClockRow() {
			const row = document.getElementById('clockRow');
			if (!row) return;
			if (!devTimeValid || devClockEpoch === null) { row.style.display = 'none'; return; }
			row.style.display = '';
			const now = devClockEpoch + Math.round((Date.now() - devClockAtMs) / 1000);
			document.getElementById('deviceClockVal').textContent =
				new Date(now * 1000).toISOString().replace('T', ' ').slice(0, 19);
		}

		function cubeLabel(c) {
			let m = c.model || 'Cube';
			if (m.indexOf('LaserCube ') === 0) m = m.substring(10);
			const suffix = (c.mac || '').replace(/:/g, '').slice(-4);
			return m + '-' + suffix;
		}

		let cubeTabsSig = '';

		function renderCubeTabs() {
			const tabs = document.getElementById('cube-tabs');
			const sig = cubes.map(c =>
				c.mac + '|' + cubeLabel(c) + '|' +
				((activeCube && activeCube.mac === c.mac) ? 'a' : '') +
				(cubeErr[c.mac] ? 'e' : '')).join(',');
			if (sig === cubeTabsSig) return;
			cubeTabsSig = sig;
			tabs.innerHTML = '';
			cubes.forEach(c => {
				const b = document.createElement('button');
				b.className = 'cube-tab';
				if (activeCube && activeCube.mac === c.mac) b.classList.add('active');
				if (cubeErr[c.mac]) b.classList.add('err');
				b.dataset.mac = c.mac;
				b.textContent = cubeLabel(c);
				tabs.appendChild(b);
			});
		}

		function teardownWs() {
			if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
			wsRetryMs = 1000;
			clearTimeout(keepAliveTimer);
			if (ws) {
				ws.onopen = null;
				ws.onclose = null;
				ws.onmessage = null;
				try { ws.close(); } catch (e) {}
				ws = null;
			}
		}

		function resetCubeState() {
			closeEffectsPopup();
			closeOverlay('tile-popup');
			closeOverlay('confirm-popup');
			toggleColorList(false);
			document.getElementById('grid').innerHTML = '';
			document.getElementById('fx-grid').innerHTML = '';
			document.getElementById('playlist-selection').innerHTML = '';
			updateSelectedName('');
			selectedImg = null;
			selectedUrl = null;
			selectedPlaylist = '';
			seenMode = null;
			plRev = null;
			plEdit = false;
			playlistOptions = [];
			fxList = null;
			fxCacheVer = 1;
			fxSelImg = '';
			fxSelCol = '';
			if (plRetryTimer) { clearTimeout(plRetryTimer); plRetryTimer = null; }
			if (gridRetryTimer) { clearTimeout(gridRetryTimer); gridRetryTimer = null; }
			if (fxRetryTimer) { clearTimeout(fxRetryTimer); fxRetryTimer = null; }
			gridSig = null;
			plSig = null;
			fxSig = null;
			gotInit = false;
			fxPopupPending = false;
			battery_pct = null;
			is_charging = null;
			is_ilock_en = null;
			temperature = null;
			wifi_col = null;
			wifi_ch = 0;
			wifi_ch_col = null;
			devClockEpoch = null;
			devTimeValid = 0;
			updateBatteryGauge();
			updateTemperature(temperature);
			updateILockLabel();
			updateWifiIcon();
			updateClockRow();
		}

		function bootstrapCube() {
			loadGrid();
			fetchSelectedUrl()
				.then(() => { if (selectedUrl) highlightGridItemByUrl(selectedUrl); })
				.catch(err => console.error('Failed to fetch selected image:', err));
			loadPlaylists();
			initWebSocket();
		}

		function restoreFromCache(e) {
			if (e.pl) renderPlaylistOptions(e.pl);
			selectedUrl = e.selUrl || null;
			if (e.grid) renderGrid(e.grid); else setGridLoading(true);
			plRev = (typeof e.plRev === 'number') ? e.plRev : null;
			if ('batt' in e) {
				battery_pct = e.batt;
				is_charging = e.chg;
				is_ilock_en = e.ilk;
				temperature = e.tmp;
				wifi_col = e.wcol || null;
				wifi_ch = e.wch || 0;
				wifi_ch_col = e.wchc || null;
				updateBatteryGauge();
				updateTemperature(temperature);
				updateILockLabel();
				updateWifiIcon();
			}
		}

		function selectCube(c) {
			if (activeCube && activeCube.mac === c.mac) return;
			cubeSavedApplied = true;
			cubeGen++;
			prefetchGen++;
			clearTimeout(prefetchTimer);
			teardownWs();
			resetCubeState();
			activeCube = c;
			deviceMode = (c.ctrl_mode === 3) ? 'viz' : 'playlist';
			localStorage.setItem('selectedCubeMac', c.mac);
			renderCubeTabs();
			jumpToCue = true;
			const cached = cubeCache.get(c.mac);
			if (cached) restoreFromCache(cached); else setGridLoading(true);
			bootstrapCube();
		}

		function loadCubes(refresh) {
			if (refresh) {
				cubeScanActive = true;
				if (userScanReq) document.getElementById('cube-refresh').classList.add('scanning');
			}
			fetch('/api/cubes' + (refresh ? '?refresh=1' : ''))
				.then(res => res.json())
				.then(d => {
					cubes = (d.cubes || []).sort((a, b) =>
						(b.self ? 1 : 0) - (a.self ? 1 : 0) ||
						a.ip.localeCompare(b.ip, undefined, { numeric: true }));
					if (!activeCube) activeCube = cubes.find(c => c.self) || null;
					const cubesSig = cubes.map(c => c.mac + '@' + c.ip).join(',');
					if (cubesSig !== lastCubesSig) {
						lastCubesSig = cubesSig;
						if (gotInit) schedulePrefetch(2000);
					}
					cubeScanActive = !!d.scanning;
					if (!d.scanning) userScanReq = false;
					document.getElementById('cube-refresh').classList.toggle('scanning', !!d.scanning && userScanReq);
					renderCubeTabs();
					if (d.scanning) {
						clearTimeout(cubeScanTimer);
						cubeScanTimer = setTimeout(() => loadCubes(false), 1000);
						return;
					}
					if (cubeScanTimer) { clearTimeout(cubeScanTimer); cubeScanTimer = null; }
					if (!cubeAutoRefreshed && cubes.length < 2) {
						cubeAutoRefreshed = true;
						loadCubes(true);
						return;
					}
					cubeAutoRefreshed = true;
					if (activeCube) {
						const cur = cubes.find(c => c.mac === activeCube.mac);
						if (!cur) {
							const self = cubes.find(c => c.self);
							if (self) { activeCube = null; selectCube(self); return; }
						} else if (cur.ip !== activeCube.ip || !ws) {
							activeCube = null;
							selectCube(cur);
							return;
						} else {
							activeCube = cur;
						}
					}
					if (!cubeSavedApplied) {
						cubeSavedApplied = true;
						const saved = localStorage.getItem('selectedCubeMac');
						const c = saved ? cubes.find(x => x.mac === saved && !x.self) : null;
						if (c) selectCube(c);
					}
				})
				.catch(() => {
					if (cubeScanTimer) { clearTimeout(cubeScanTimer); cubeScanTimer = null; }
					cubeScanActive = false;
					userScanReq = false;
					document.getElementById('cube-refresh').classList.remove('scanning');
				});
		}

		function fetchWithTimeout(url) {
			const ctl = new AbortController();
			const t = setTimeout(() => ctl.abort(), 5000);
			return fetch(url, { signal: ctl.signal }).finally(() => clearTimeout(t));
		}

		function schedulePrefetch(ms) {
			clearTimeout(prefetchTimer);
			prefetchTimer = setTimeout(runPrefetch, ms || 4000);
		}

		function runPrefetch() {
			const myGen = ++prefetchGen;
			if (!gotInit || cubeScanActive) {
				schedulePrefetch(5000);
				return;
			}
			const targets = cubes.filter(c => !activeCube || c.mac !== activeCube.mac);
			const next = i => {
				if (myGen !== prefetchGen || i >= targets.length) return;
				const c = targets[i];
				const base = c.self ? '' : 'http://' + c.ip;
				fetchWithTimeout(base + '/api/playlist/playlist-items')
					.then(r => r.json())
					.then(pl => {
						if (myGen !== prefetchGen) throw 0;
						cacheFor(c.mac).pl = pl;
						return fetchWithTimeout(base + '/api/playlist/selected-image');
					})
					.then(r => r.json())
					.then(d => {
						if (myGen !== prefetchGen) throw 0;
						cacheFor(c.mac).selUrl = d.url || null;
						return fetchWithTimeout(base + '/api/playlist/image-list');
					})
					.then(r => r.json())
					.then(list => {
						if (myGen !== prefetchGen) throw 0;
						cacheFor(c.mac).grid = list;
						return fetchWithTimeout(base + '/api/effects/effect-list');
					})
					.then(r => r.json())
					.then(data => {
						if (myGen !== prefetchGen) return;
						const fx = data.effects || [];
						fx.sort((a, b) => {
							const an = a.name.toLowerCase(), bn = b.name.toLowerCase();
							return an < bn ? -1 : an > bn ? 1 : 0;
						});
						const e = cacheFor(c.mac);
						e.fxList = fx;
						e.fxCacheVer = data.cache_version || 1;
					})
					.catch(() => {})
					.finally(() => next(i + 1));
			};
			next(0);
		}

		function initWebSocket() {
			ws = new WebSocket(`ws://${wsHost()}/ws`);
			ws.onopen = () => {
				if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
				wsRetryMs = 1000;
				timeSyncSent = false;
				send_ws_connect_msg();
				console.log("websocket opened to MK2");
			};
			ws.onclose = () => {
				console.warn("WebSocket closed, retrying...");
				reconnectTimer = setTimeout(initWebSocket, wsRetryMs);
				wsRetryMs = Math.min(wsRetryMs * 2, RECONNECT_DELAY);
			};
			ws.onmessage = (event) => {
				const msg = JSON.parse(event.data);
				lastWsMsgMs = Date.now();
				resetKeepAlive();
				parse_msg(msg);
			};
		}

		function resetKeepAlive() {
			clearTimeout(keepAliveTimer);
			keepAliveTimer = setTimeout(() => {
				if (ws && ws.readyState === WebSocket.OPEN) {
					ws.send(JSON.stringify({ type: "get_info" }));
					resetKeepAlive();
				}
			}, KEEPALIVE_TIMEOUT);
		}

		function applyTheme(themeName) {
		  document.documentElement.classList.forEach(cls => {
		    if (cls.startsWith("theme-")) {
		      document.documentElement.classList.remove(cls);
		    }
		  });

		  document.documentElement.classList.add(themeName);

		  localStorage.setItem("selectedTheme", themeName);
		}

		document.addEventListener('DOMContentLoaded', () => {

			const defaultTheme = 'theme-dark-blue';
			const footerButtons = document.querySelectorAll('.footer-buttons button');
			const selectedBox = document.getElementById('selected-box');
			const powerBtn = document.querySelector('.power-btn');
			const menuBtn = document.getElementById('menuBtn');
			const sliderPanel = document.getElementById('sliderPanel');
			const settingsBtn = document.getElementById('settingsBtn');
			const settingsPanel = document.getElementById('settingsPanel');
			const colorizeBtn = document.getElementById('colorBtn');
			const themeselector = document.getElementById('theme-selection');
			const storedTheme = localStorage.getItem('selectedTheme') || defaultTheme;
			const leftbtngroups = [
			  { btn: menuBtn, panel: sliderPanel },
			  { btn: settingsBtn, panel: settingsPanel }
			];

			function handleFooterLeftBtnGrpClick(clicked) {
			  closeEffectsPopup();
			  leftbtngroups.forEach(({ btn, panel }) => {
			    if (btn === clicked.btn) {
			      btn.classList.toggle("active");
			      panel.classList.toggle("active");
			    } else {
			      btn.classList.remove("active");
			      panel.classList.remove("active");
			    }
			  });
			}

		    applyTheme(storedTheme);
		    themeselector.value = storedTheme;

		    themeselector.addEventListener('change', () => {
				applyTheme(themeselector.value);
		    });

		    document.getElementById('syncClockBtn').addEventListener('click', () => {
				if (ws && ws.readyState === WebSocket.OPEN) {
					ws.send(JSON.stringify({ settime: localWallEpoch() }));
				}
		    });
		    setInterval(updateClockRow, 1000);

		    leftbtngroups.forEach(item => {
			  	item.btn.addEventListener("click", () => handleFooterLeftBtnGrpClick(item));
			});

			footerButtons.forEach(btn => {
				btn.addEventListener('click', () => {
					btn.classList.add('clicked');
					setTimeout(() => {
						btn.classList.remove('clicked');
					}, FLASH_PERIOD_MS);
				});
			});

			powerBtn.addEventListener('click', () => {
				powerBtn.classList.add('clicked');
				setTimeout(() => {
					powerBtn.classList.remove('clicked');
				}, FLASH_PERIOD_MS);
			});

			colorizeBtn.addEventListener('click', () => {
				leftbtngroups.forEach(({ btn, panel }) => {
					btn.classList.remove('active');
					panel.classList.remove('active');
				});
				const overlay = document.getElementById('effects-popup');
				if (overlay.classList.contains('active')) closeEffectsPopup();
				else openEffectsPopup();
			});

			document.getElementById('fx-tab-img').addEventListener('click', () => setFxTab('img'));
			document.getElementById('fx-tab-col').addEventListener('click', () => setFxTab('col'));

			selectedBox.addEventListener('click', () => {
			if (selectedUrl) {
					highlightGridItemByUrl(selectedUrl);
					selectedBox.classList.add('selectedBox-glow');
					setTimeout(() => {
					  selectedBox.classList.remove('selectedBox-glow');
					}, FLASH_PERIOD_MS);
				}
			});

			document.addEventListener("visibilitychange", () => {
				if (document.visibilityState === "visible") {
					if (!ws || ws.readyState !== WebSocket.OPEN) {
						console.log("Reconnecting WebSocket after tab visible...");
						initWebSocket();
					} else {
						send_ws_connect_msg();
					}
				}
			});

			document.getElementById('playlist-selection').addEventListener('change', function() {
				selectedPlaylist = this.value;
				updateDeleteBtn();
				fetch(cubeBase() + '/api/playlist/playlist-selected', {
					method: 'POST',
					headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
					body: 'playlist=' + encodeURIComponent(this.value)
				})
				.then(res => {
					if (!res.ok) throw new Error('Failed to set playlist');
					return res.text();
				})
				.then(() => getSelectedPlaylistImage())
				.catch(err => console.error('Error updating playlist:', err));
			});

			buildColorList();
			document.getElementById('tile-popup-targets').addEventListener('scroll', refreshPopupScrollInds);
			document.getElementById('apc-color-list').addEventListener('scroll', refreshPopupScrollInds);
			document.getElementById('apc-color-btn').addEventListener('click', () => {
				const list = document.getElementById('apc-color-list');
				toggleColorList(list.style.display === 'none');
			});
			document.getElementById('playlist-delete-btn').addEventListener('click', openConfirmPopup);
			document.getElementById('tile-popup-cancel').addEventListener('click', () => closeOverlay('tile-popup'));
			document.getElementById('confirm-cancel').addEventListener('click', () => closeOverlay('confirm-popup'));
			document.getElementById('sd-warn-close').addEventListener('click', () => closeOverlay('sd-warn-popup'));
			const tilePopupImg = document.getElementById('tile-popup-img');
			tilePopupImg.addEventListener('error', () => { tilePopupImg.style.opacity = '0'; });
			tilePopupImg.addEventListener('load', () => { tilePopupImg.style.opacity = ''; });
			document.getElementById('new-pl-create').addEventListener('click', () => {
				const name = document.getElementById('new-pl-name').value.trim();
				if (!name) { setPopupMsg('Enter a playlist name'); return; }
				if (new TextEncoder().encode(name).length > 63) {
					setPopupMsg('Playlist name is too long');
					return;
				}
				postPlaylistEdit('create', name, popupItemName, () => {
					setPopupMsg('Created "' + name + '"', true);
					popupAutoClose();
					document.getElementById('new-pl-name').value = '';
					loadPlaylists();
				});
			});
			['tile-popup', 'confirm-popup', 'sd-warn-popup'].forEach(id => {
				const overlay = document.getElementById(id);
				overlay.addEventListener('click', e => { if (e.target === overlay) closeOverlay(id); });
			});

			document.getElementById('animatedSwitch').addEventListener('change', e => {
				if (ws && ws.readyState === WebSocket.OPEN) {
					let state = e.target.checked;
					ws.send(JSON.stringify({ previews: state }));
					getSelectedPlaylistImage();
				}
			});

			document.getElementById('shuffleSwitch').addEventListener('change', e => {
				if (ws && ws.readyState === WebSocket.OPEN) {
					let state = e.target.checked;
					ws.send(JSON.stringify({ shuffle: state }));
				}
			});

			setInterval(() => {
				document.querySelector('.footer').classList.toggle('offline', Date.now() - lastWsMsgMs > 10000);
			}, 2000);

			document.getElementById('cube-refresh').addEventListener('click', e => {
				const b = e.currentTarget;
				b.classList.add('clicked');
				setTimeout(() => b.classList.remove('clicked'), FLASH_PERIOD_MS);
				userScanReq = true;
				loadCubes(true);
			});
			document.getElementById('cube-tabs').addEventListener('click', e => {
				let tab = e.target.closest ? e.target.closest('.cube-tab') : null;
				if (!tab) {
					const el = document.elementFromPoint(e.clientX, e.clientY);
					tab = el ? el.closest('.cube-tab') : null;
				}
				if (!tab) return;
				const c = cubes.find(x => x.mac === tab.dataset.mac);
				if (c) selectCube(c);
			});
			loadCubes(false);
			setInterval(() => {
				if (!cubeScanTimer && !cubeScanActive) loadCubes(cubes.length < 2);
			}, 10000);
			setupSlider('projection/Power', 'power-value', 'resetPowerBtn', 0, 100, 100);
			setupSlider('projection/Zoom', 'zoom-value', 'resetZoomBtn', 0, 100, 100);
			setupSlider('projection/Rotation', 'rotation-value', 'resetRotationBtn', -90, 90, 0);
			setupSlider('Speed', 'playspeed-value', 'resetSpeedBtn', 10, 200, 100);
			setupSlider('playlist_player/Cue Delay', 'cuedelay-value', 'resetCueDelayBtn', 1, 100, 10);
			bootstrapCube();

			updateTemperature(temperature);
		});
	</script>
</body>
